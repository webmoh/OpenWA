name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # كل يوم 3 الفجر
  workflow_dispatch:      # أو يدويًا

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Add upstream
        run: git remote add upstream https://github.com/rmyndharis/OpenWA.git
      
      - name: Fetch upstream
        run: git fetch upstream
      
      - name: Merge upstream (keep our compose)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # احفظ نسخة من docker-compose.yml
          cp docker-compose.yml /tmp/my-compose.yml
          
          # دمج التحديثات من upstream
          git checkout main
          git merge upstream/main --no-edit || true
          
          # رجّع الـ compose بتاعك
          cp /tmp/my-compose.yml docker-compose.yml
          
          # ارفع التغييرات
          git add -A
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Sync with upstream + keep EasyPanel compose"
          
          git push origin main
