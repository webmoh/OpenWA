services:
  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwa-openwa-api:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=2785
      - TZ=UTC
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - RESOLVE_LID_TO_PHONE=true
      - SERVE_DASHBOARD=true
      - CSP_UPGRADE_INSECURE_REQUESTS=true
      - WWEBJS_AUTH_TIMEOUT_MS=180000
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-gpu
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
    volumes:
      - openwa-data:/app/data
    expose:
      - '2785'

volumes:
  openwa-data:
    external: true
    name: openwa_openwa-data